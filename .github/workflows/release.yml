name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    if: github.actor == github.repository_owner
    runs-on: macos-14

    steps:
      - name: Validate Branch and Version
        run: |
          echo "Triggered by owner: ${{ github.actor }}"
          echo "Target release version: ${{ inputs.version }}"
          echo "Target branch: rc-${{ inputs.version }}"

      - name: Checkout RC Branch
        uses: actions/checkout@v4
        with:
          ref: rc-${{ inputs.version }}
          fetch-depth: 0

      - name: Run Tests
        run: swift test -v

      - name: Build Release Binary
        run: swift build -c release

      - name: Package Binary
        run: |
          BIN_DIR="$(swift build -c release --show-bin-path)"
          PACKAGE_NAME="lookin-mcp-v${{ inputs.version }}-macos.tar.gz"
          tar -czvf "$PACKAGE_NAME" -C "$BIN_DIR" lookin-mcp
          echo "PACKAGE_PATH=$PACKAGE_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version }}"
          target_commitish: "rc-${{ inputs.version }}"
          name: "Release v${{ inputs.version }}"
          draft: false
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: ${{ env.PACKAGE_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
